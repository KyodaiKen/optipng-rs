[package]
name = "liboptipng-rs"
version = "0.5.0"
edition = "2024"
description = "Core PNG optimization library — reduction, trials, IDAT fast path, external format decoders"

[lib]
name = "liboptipng_rs"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
decoder = { path = "../png_stream_dec/decoder" }
encoder = { path = "../png_stream_enc/encoder" }
sysinfo = "0.30"
console = "0.15"
indicatif = "0.17"
